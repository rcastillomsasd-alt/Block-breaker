<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Court | Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-layout">
    <aside class="life-rail" aria-label="Spare balls">
      <p class="rail-title">BALLS</p>
      <div class="ball-holder" id="reserve-balls" aria-label="4 spare balls">
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
      </div>
      <div class="spring" aria-hidden="true">
        <div class="spring-coil"></div>
        <div class="spring-base"></div>
      </div>
    </aside>
    <section class="game-stage" aria-label="Block Breaker">
      <header class="arena-header">
        <div>
          <p class="eyebrow" id="arena-eyebrow">BASKETBALL ARCADE / 1990s EDITION</p>
          <h1>FULL COURT</h1>
        </div>
        <p class="edition-mark"><span id="edition-label">LEGEND</span><br><strong id="level-label">23</strong></p>
      </header>
      <div class="canvas-shell">
        <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
        <div class="game-overlay" id="game-overlay" hidden aria-live="polite">
          <h1 id="game-message"></h1>
          <figure class="win-portrait" id="win-portrait" hidden>
            <img src="assets/michael-jordan.jpg" alt="Michael Jordan playing basketball in 1997">
            <figcaption>
              Michael Jordan, 1997. Photo by
              <a href="https://commons.wikimedia.org/wiki/File:Steve_Lipfosky_--_Michael_Jordan_(1997)_(cropped)_3x4.jpg">Steve Lipofsky</a>,
              <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>.
            </figcaption>
          </figure>
          <figure class="win-portrait" id="watermelon-portrait" hidden>
            <img src="assets/watermelon-slice.jpg" alt="A slice of watermelon">
            <figcaption>
              Watermelon photo by
              <a href="https://commons.wikimedia.org/wiki/File:Slice_of_Watermelon_from_Wilson_Farm,_Lexington_MA.jpg">John Phelan</a>,
              <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>.
            </figcaption>
          </figure>
          <figure class="win-portrait bike-portrait" id="bike-portrait" hidden>
            <img src="assets/surron-light-bee.jpg" alt="Sur-Ron Light Bee X electric dirt bike">
            <figcaption>Sur-Ron Light Bee X photo from <a href="https://surronebikeusa.com/product/surron-light-bee-x/">Surron eBike USA</a>.</figcaption>
          </figure>
          <button id="restart-button" type="button">Play again</button>
        </div>
      </div>
      <p class="controls-copy">MOVE WITH <kbd>←</kbd> <kbd>→</kbd> OR <kbd>A</kbd> <kbd>D</kbd></p>
      <div class="level-music" id="level-music" hidden>
        <label for="minecraft-track">MICE ON VENUS</label>
        <input id="minecraft-track" type="file" accept="audio/*" aria-label="Choose a local Mice On Venus audio file">
        <audio id="minecraft-audio" controls loop preload="none" aria-label="Minecraft level music"></audio>
      </div>
    </section>
    <aside class="minecraft-character" id="minecraft-character" aria-label="Steve wearing diamond armor" hidden>
      <p class="character-label">STEVE<br><span>DIAMOND ARMOR</span></p>
      <img class="steve-image" src="assets/steve-in-diamond-armor.png" alt="Steve wearing diamond armor">
    </aside>
    <aside class="bike-character" id="bike-character" aria-label="Sur-Ron Light Bee electric dirt bike" hidden>
      <p class="character-label">LIGHT BEE<br><span>ELECTRIC DIRTBIKE</span></p>
      <img class="bike-image" src="assets/surron-light-bee.jpg" alt="Sur-Ron Light Bee X electric dirt bike">
    </aside>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
