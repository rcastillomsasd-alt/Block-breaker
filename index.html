<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-layout">
    <aside class="life-rail" aria-label="Spare balls">
      <p class="rail-title">BALLS</p>
      <div class="ball-holder" id="reserve-balls" aria-label="4 spare balls">
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
        <span class="reserve-ball" aria-hidden="true"></span>
      </div>
      <div class="spring" aria-hidden="true">
        <div class="spring-coil"></div>
        <div class="spring-base"></div>
      </div>
    </aside>
    <section class="game-stage" aria-label="Block Breaker">
      <div class="canvas-shell">
        <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
        <div class="game-overlay" id="game-overlay" hidden aria-live="polite">
          <h1 id="game-message"></h1>
          <button id="restart-button" type="button">Play again</button>
        </div>
      </div>
      <p>Move the paddle with the left and right arrow keys, or A and D.</p>
    </section>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
